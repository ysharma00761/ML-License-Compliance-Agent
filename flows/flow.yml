name: "ML License Compliance Flow"
description: |
  Scans the current project for ML license compliance violations across
  Python packages, Hugging Face models, and training datasets. Returns
  a severity-ranked findings report with remediation guidance.
public: true
definition:
  version: v1
  environment: ambient

  components:
    - name: "compliance_scanner"
      type: AgentComponent
      prompt_id: "compliance_prompt"
      inputs:
        - "context:goal"
      toolset:
        - read_file
        - read_files
        - get_issue
        - create_issue_note
      ui_log_events:
        - on_agent_final_answer
        - on_tool_execution_success

  prompts:
    - prompt_id: "compliance_prompt"
      name: "ML Compliance Scanner Prompt"
      prompt_template:
        system: |
          You are the ML License Compliance Agent. Scan the project for license
          compliance risks across three dimensions:

          1. Python packages — check requirements.txt, pyproject.toml, Pipfile for
             GPL contamination, AGPL SaaS risks, and bundled proprietary binaries.
          2. Hugging Face models — find .from_pretrained() calls, resolve licenses,
             check Llama attribution/distillation obligations and OpenRAIL restrictions.
          3. Training datasets — find load_dataset() calls, resolve licenses, flag
             CC-BY-NC commercial traps and CC-BY-SA ShareAlike propagation.

          Classify findings as CRITICAL, HIGH, MEDIUM, WARNING, or INFO.
          Provide specific remediation for each finding.
          Reference exact license clauses when possible.

        user: |
          {{goal}}
        placeholder: history
      unit_primitives: []
      params:
        timeout: 180

  routers:
    - from: "compliance_scanner"
      to: "end"

  flow:
    entry_point: "compliance_scanner"
